<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>環規・柱規 產品編號規格對照表</title><style>
:root{--blue:#0d4f87;--blue2:#1473e6;--ink:#102a4c;--line:#dce8f5;--bg:#f4f8fc;--green:#dff7e5;--amber:#fff2cc}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:linear-gradient(#eef6fd,#fff);color:var(--ink)}.hero{padding:32px max(24px,5vw);background:linear-gradient(110deg,#f8fbff,#e7f1fb);border-bottom:1px solid #dce8f5}.hero h1{font-size:clamp(28px,4vw,48px);margin:0 0 8px}.hero p{font-size:18px;margin:0;color:#37597c}.wrap{max-width:1400px;margin:auto;padding:22px}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:12px;background:white;padding:18px;border-radius:18px;box-shadow:0 8px 28px #2a5b8c14}.search{width:100%;padding:15px 18px;border:1px solid #bed2e8;border-radius:12px;font-size:17px;outline:none}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:var(--blue2);color:#fff}.ghost{background:#fff;color:var(--ink);border:1px solid #c9d9e9}.tabs{display:flex;gap:12px;align-items:center;margin:20px 0;flex-wrap:wrap}.tab{padding:10px 22px;border-radius:12px;border:0;background:#e5eff9;color:#143b62;font-weight:700;cursor:pointer}.tab.active{background:#176de0;color:#fff}.count{margin-left:auto;color:#56718e}.card{background:#fff;border:1px solid #d9e7f4;border-radius:16px;overflow:hidden;box-shadow:0 8px 25px #315a7c10}table{width:100%;border-collapse:collapse}th{background:var(--blue);color:white;text-align:left;padding:16px 24px;font-size:17px}td{padding:14px 24px;border-bottom:1px solid #e2ebf4;font-size:17px}tr:hover td{background:#f5faff}.badge{display:inline-block;padding:5px 14px;border-radius:10px;font-weight:700;background:#d7ecff;color:#0960bf}.badge.pg{background:var(--green);color:#087333}.typebadge{display:inline-block;margin-left:8px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#d7ecff;color:#0960bf}.typebadge.pg{background:var(--green);color:#087333}.typebadge.unknown{background:var(--amber);color:#8a5a00}.hint{margin-top:8px;font-size:13px;color:#6b8198}.actions{display:flex;gap:7px}.small{padding:7px 10px;border-radius:8px;border:1px solid #cad9e7;background:#fff;cursor:pointer}.empty{text-align:center;padding:42px;color:#71879d}.modal{position:fixed;inset:0;background:#0b23435c;display:none;place-items:center;padding:20px}.modal.show{display:grid}.dialog{width:min(480px,100%);background:white;border-radius:18px;padding:24px;box-shadow:0 24px 60px #102b4b40}.dialog h2{margin-top:0}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid #c9d8e7;border-radius:10px;font-size:16px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(max-width:700px){.hero{padding:24px 18px}.wrap{padding:14px}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.count{width:100%;margin-left:0}table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{padding:14px;border-bottom:1px solid #dce7f2}td{border:0;padding:7px 14px}td:before{content:attr(data-label);display:block;font-size:12px;color:#72869b;margin-bottom:4px}.actions{margin-top:6px}}
</style></head><body><header class="hero"><h1>環規・柱規 產品編號規格對照表</h1><p>快速查詢公司內部環規・柱規的產品編號與規格尺寸</p></header><main class="wrap"><section class="toolbar"><input id="q" class="search" placeholder="請輸入產品編號或規格尺寸（例如：RG-001、Φ10、M10）"><button class="btn primary" onclick="openModal()">＋ 新增資料</button><button class="btn ghost" onclick="clearSearch()">清除條件</button></section><div class="tabs"><button class="tab active" data-filter="all">全部</button><button class="tab" data-filter="環規">環規</button><button class="tab" data-filter="柱規">柱規</button><span id="syncStatus" style="font-size:14px;color:#56718e">☁️ 連線中…</span><span class="count" id="count"></span></div><section class="card"><table><thead><tr><th>產品編號</th><th>規格尺寸／自動判斷</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty" hidden>查無符合的資料</div></section></main><div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">新增資料</h2><div class="field"><label>產品編號</label><div style="display:flex;align-items:center;border:1px solid #c9d8e7;border-radius:10px;overflow:hidden;background:#fff"><span style="padding:12px 0 12px 12px;font-size:16px;font-weight:700;color:#37597c;white-space:nowrap">DY-PB-</span><input id="code" inputmode="numeric" pattern="[0-9]*" placeholder="請輸入數字" style="border:0;border-radius:0;padding-left:4px"></div><div class="hint">例如輸入 25，產品編號會自動儲存為 DY-PB-25</div></div><div class="field"><label>規格尺寸</label><input id="size" placeholder="例如 Φ10 H7、Φ10 h6、M10 × 1.5 外牙"><div class="hint" id="autoTypeHint">輸入規格後，系統會自動分析環規／柱規</div></div><div class="field" id="manualTypeField" hidden><label>類別確認</label><select id="manualType"><option value="">請選擇</option><option value="環規">環規</option><option value="柱規">柱規</option></select><div class="hint">自動判斷為待確認時，請手動選擇環規或柱規。</div></div><div class="dialog-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveItem()">儲存</button></div></div></div><script>
const SUPABASE_URL='https://zqttfqdywfdnljqtvvxo.supabase.co';
const SUPABASE_KEY='sb_publishable_Q91dRkV1gWldde8qb2z0QA_iIomSL6-';
const API=SUPABASE_URL+'/rest/v1/gauges';
let data=[],filter='all',editing=null;
const tbody=document.getElementById('tbody'),q=document.getElementById('q'),syncStatus=document.getElementById('syncStatus');
function headers(extra={}){return {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...extra}}
function setStatus(msg,ok=true){syncStatus.textContent=(ok?'☁️ ':'⚠️ ')+msg;syncStatus.style.color=ok?'#56718e':'#b42318'}
function analyzeType(v){let t=String(v||'').trim();if(/(內牙|內螺紋|孔|內徑|母牙)/i.test(t)||/[ØΦφ]?\s*\d+(?:\.\d+)?\s*H\d+/i.test(t))return'柱規';if(/(外牙|外螺紋|軸|外徑|公牙)/i.test(t)||/[ØΦφ]?\s*\d+(?:\.\d+)?\s*h\d+/.test(t))return'環規';return'待確認'}
function typeClass(t){return t==='柱規'?'pg':t==='待確認'?'unknown':''}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sortRows(a,b){let ma=a.code.match(/^DY-PB-(\d+)$/i),mb=b.code.match(/^DY-PB-(\d+)$/i);if(ma&&mb)return Number(ma[1])-Number(mb[1]);if(ma)return-1;if(mb)return 1;return a.code.localeCompare(b.code,undefined,{numeric:true,sensitivity:'base'})}
function render(){let s=q.value.trim().toLowerCase();let rows=data.filter(x=>(filter==='all'||x.type===filter)&&(!s||x.code.toLowerCase().includes(s)||x.size.toLowerCase().includes(s))).sort(sortRows);tbody.innerHTML=rows.map(x=>`<tr><td data-label="產品編號"><span class="badge ${x.type==='柱規'?'pg':''}">${esc(x.code)}</span></td><td data-label="規格尺寸">${esc(x.size)} <span class="typebadge ${typeClass(x.type)}">${esc(x.type)}</span></td><td data-label="操作"><div class="actions"><button class="small" onclick="editItem(${x.id})">修改</button><button class="small" onclick="removeItem(${x.id})">刪除</button></div></td></tr>`).join('');document.getElementById('count').textContent=`共 ${rows.length} 筆資料`;document.getElementById('empty').hidden=rows.length>0}
async function loadData(){setStatus('同步中…');try{let r=await fetch(API+'?select=id,product_code,specification,gauge_type&order=product_code.asc',{headers:headers()});if(!r.ok)throw new Error(await r.text());let rows=await r.json();data=rows.map(x=>({id:x.id,code:x.product_code,size:x.specification,type:x.gauge_type}));render();setStatus('雲端已同步')}catch(e){console.error(e);setStatus('雲端連線失敗',false);alert('無法讀取雲端資料，請確認網路與 Supabase 設定。')}}
q.addEventListener('input',render);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
function clearSearch(){q.value='';filter='all';document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('active',i===0));render()}
function updateTypeUI(preferred=''){let t=analyzeType(size.value);if(t==='待確認'){manualTypeField.hidden=false;if(preferred==='環規'||preferred==='柱規')manualType.value=preferred;autoTypeHint.textContent='自動判斷：待確認，請手動選擇環規或柱規'}else{manualTypeField.hidden=true;manualType.value='';autoTypeHint.textContent='自動判斷：'+t}return t}
function openModal(){editing=null;modalTitle.textContent='新增資料';code.value='';code.dataset.fullCode='';size.value='';manualType.value='';manualTypeField.hidden=true;autoTypeHint.textContent='輸入規格後，系統會自動分析環規／柱規';modal.classList.add('show')}
function closeModal(){modal.classList.remove('show')}
async function saveItem(){let raw=code.value.trim(),s=size.value.trim();if(!raw||!s)return alert('請輸入產品編號數字與規格尺寸');if(!/^\d+$/.test(raw))return alert('產品編號請只輸入數字');let c='DY-PB-'+raw;let auto=analyzeType(s),finalType=auto==='待確認'?manualType.value:auto;if(!finalType)return alert('此規格無法自動判斷，請手動選擇環規或柱規');let payload={product_code:c,specification:s,gauge_type:finalType};setStatus('儲存中…');try{let url=editing?API+'?id=eq.'+editing:API;let r=await fetch(url,{method:editing?'PATCH':'POST',headers:headers({'Prefer':'return=representation'}),body:JSON.stringify(payload)});if(!r.ok){let msg=await r.text();if(r.status===409||msg.includes('duplicate'))throw new Error('產品編號已存在');throw new Error(msg)}closeModal();await loadData()}catch(e){console.error(e);setStatus('儲存失敗',false);alert(e.message==='產品編號已存在'?'此產品編號已存在，請輸入其他數字。':'儲存失敗，請稍後再試。')}}
function editItem(id){let x=data.find(x=>x.id===id);editing=id;modalTitle.textContent='修改資料';code.dataset.fullCode=x.code;code.value=x.code.startsWith('DY-PB-')?x.code.slice(6):x.code;size.value=x.size;manualType.value='';updateTypeUI(x.type);modal.classList.add('show')}
async function removeItem(id){if(!confirm('確定要刪除這筆資料嗎？'))return;setStatus('刪除中…');try{let r=await fetch(API+'?id=eq.'+id,{method:'DELETE',headers:headers()});if(!r.ok)throw new Error(await r.text());await loadData()}catch(e){console.error(e);setStatus('刪除失敗',false);alert('刪除失敗，請稍後再試。')}}
size.addEventListener('input',()=>updateTypeUI());modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});loadData();
</script></body></html>
